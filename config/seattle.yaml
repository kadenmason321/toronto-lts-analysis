city_name: "Seattle"
country: "USA"

query_place: "Seattle, Washington, USA"

speed_unit: "mph"


tags:
  mixed_traffic_highways:
    - residential
    - tertiary
    - secondary
    - primary
    - unclassified
    - living_street

  exclude_highways:
    - motorway
    - motorway_link
    - trunk
    - trunk_link

  cycleway_values:
    track: "protected"
    opposite_track: "protected"
    lane: "bike_lane"
    opposite_lane: "bike_lane"
    shared_lane: "mixed"
    share_busway: "mixed"
    no: "mixed"

  cycleway_side_keys:
    - cycleway
    - cycleway:left
    - cycleway:right
    - cycleway:both

  parking_keys:
    - parking:lane:left
    - parking:lane:right
    - parking:lane:both

  parking_present_values:
    - parallel
    - diagonal
    - perpendicular

defaults:
  # Same already-converted-to-km/h approach as Corvallis: these are
  # typical US speed limits (mph) pre-converted to km/h, since the
  # fallback code path doesn't re-run the mph conversion.
  speed_by_highway:
    residential: 40   # ~25 mph
    living_street: 24  # ~15 mph
    tertiary: 56       # ~35 mph
    secondary: 56       # ~35 mph
    primary: 72         # ~45 mph
    unclassified: 48    # ~30 mph

  lanes_by_highway:
    residential: 2
    living_street: 1
    tertiary: 2
    secondary: 4
    primary: 4
    unclassified: 2
include_standalone_cycleways: true
