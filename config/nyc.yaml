city_name: "New York City"
country: "USA"

query_place: "New York City, New York, USA"

speed_unit: "mph"

include_standalone_cycleways: true

tags:
  mixed_traffic_highways:
    - residential
    - tertiary
    - secondary
    - primary
    - unclassified
    - living_street

  exclude_highways:
    - motorway
    - motorway_link
    - trunk
    - trunk_link

  cycleway_values:
    track: "protected"
    opposite_track: "protected"
    lane: "bike_lane"
    opposite_lane: "bike_lane"
    shared_lane: "mixed"
    share_busway: "mixed"
    no: "mixed"

  cycleway_side_keys:
    - cycleway
    - cycleway:left
    - cycleway:right
    - cycleway:both

  parking_keys:
    - parking:lane:left
    - parking:lane:right
    - parking:lane:both

  parking_present_values:
    - parallel
    - diagonal
    - perpendicular

defaults:
  speed_by_highway:
    residential: 40
    living_street: 24
    tertiary: 56
    secondary: 56
    primary: 72
    unclassified: 48

  lanes_by_highway:
    residential: 2
    living_street: 1
    tertiary: 2
    secondary: 4
    primary: 4
    unclassified: 2
